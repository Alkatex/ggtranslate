<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fond noir gaming -->
  <rect width="512" height="512" rx="80" fill="#06080f"/>
  
  <!-- Lueur de fond -->
  <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#06080f" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="80" fill="url(#bg-glow)"/>

  <!-- Globe principal -->
  <circle cx="256" cy="230" r="120" fill="none" stroke="#06b6d4" stroke-width="6"/>
  
  <!-- Méridien vertical -->
  <ellipse cx="256" cy="230" rx="55" ry="120" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.7"/>
  
  <!-- Lignes horizontales globe -->
  <line x1="136" y1="230" x2="376" y2="230" stroke="#06b6d4" stroke-width="3" opacity="0.7"/>
  <line x1="148" y1="178" x2="364" y2="178" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
  <line x1="148" y1="282" x2="364" y2="282" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
  <line x1="175" y1="138" x2="337" y2="138" stroke="#06b6d4" stroke-width="1.5" opacity="0.25"/>
  <line x1="175" y1="322" x2="337" y2="322" stroke="#06b6d4" stroke-width="1.5" opacity="0.25"/>

  <!-- Ondes sonores gauche -->
  <path d="M108 190 Q88 230 108 270" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <path d="M82 165 Q52 230 82 295" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M56 145 Q16 230 56 315" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Ondes sonores droite -->
  <path d="M404 190 Q424 230 404 270" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <path d="M430 165 Q460 230 430 295" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M456 145 Q496 230 456 315" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Points lumineux globe -->
  <circle cx="256" cy="110" r="5" fill="#06b6d4"/>
  <circle cx="256" cy="350" r="5" fill="#06b6d4"/>
  <circle cx="136" cy="230" r="5" fill="#3b82f6"/>
  <circle cx="376" cy="230" r="5" fill="#3b82f6"/>

  <!-- Texte GGTRANSLATE -->
  <text x="256" y="430" 
    font-family="Arial Black, sans-serif" 
    font-weight="900" 
    font-size="42" 
    fill="url(#text-grad)" 
    text-anchor="middle"
    letter-spacing="2">GGTRANSLATE</text>

  <!-- Gradient texte -->
  <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#06b6d4"/>
    <stop offset="100%" stop-color="#3b82f6"/>
  </linearGradient>

  <!-- Ligne décorative sous texte -->
  <line x1="100" y1="448" x2="412" y2="448" stroke="url(#text-grad)" stroke-width="2" opacity="0.5"/>

  <!-- Bordure extérieure -->
  <rect x="4" y="4" width="504" height="504" rx="78" fill="none" stroke="#06b6d4" stroke-width="4" opacity="0.3"/>
  <rect x="10" y="10" width="492" height="492" rx="74" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.2"/>
</svg>